<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Recorder E2E Fixture</title><style>body{min-height:1800px;font-family:sans-serif}.primary-action{color:rgb(49,94,251)}#gesture{width:300px;height:140px;overflow:auto;border:1px solid #999;touch-action:none}.gesture-content{width:900px;height:400px;background:linear-gradient(90deg,#eef,#fee)}#drag-source,#drop-target{display:inline-grid;place-items:center;width:130px;height:60px;margin:12px;border:1px solid #777}#scroll-marker{margin-top:900px}</style><body><label>搜索 <input role="combobox" aria-label="搜索" id="search" name="query"></label><button id="submit" class="primary-action" data-kind="search" aria-description="提交搜索内容">搜索</button><button id="tap">轻触按钮</button><button id="slow">慢速结果</button><button id="api">加载接口结果</button><label>上传文件 <input id="upload" type="file"></label><select id="multi" multiple aria-label="多选值"><option value="alpha" selected>Alpha</option><option value="beta" selected>Beta</option></select><span data-testid="loading" hidden>加载中</span><p id="result" role="status"></p><div id="empty"></div><div id="gesture"><div class="gesture-content">滑动区域</div></div><div id="drag-source" draggable="true">拖拽源</div><div id="drop-target">拖拽目标</div><div id="scroll-marker">滚动目标</div><script>const result=document.querySelector('#result');const loading=document.querySelector('[data-testid="loading"]');const show=()=>result.textContent=`Results for: ${document.querySelector('#search').value}`;document.querySelector('#submit').onclick=show;document.querySelector('#submit').oncontextmenu=e=>{e.preventDefault();result.textContent='Right click ready'};document.querySelector('#tap').onclick=()=>result.textContent='Tap ready';document.querySelector('#search').onkeydown=e=>{if(e.key==='Enter')show()};document.querySelector('#slow').onclick=()=>{loading.hidden=false;setTimeout(()=>{result.textContent='Slow result ready';loading.hidden=true},350)};document.querySelector('#api').onclick=async()=>{loading.hidden=false;try{const response=await fetch('/api/test-fixtures/flaky');result.textContent=response.ok?'API ready':`API ${response.status}`}finally{loading.hidden=true}};document.querySelector('#drag-source').ondragstart=e=>e.dataTransfer.setData('text/plain','dragged');document.querySelector('#drop-target').ondragover=e=>e.preventDefault();document.querySelector('#drop-target').ondrop=e=>{e.preventDefault();e.currentTarget.textContent='Dropped'};</script></body></html>
