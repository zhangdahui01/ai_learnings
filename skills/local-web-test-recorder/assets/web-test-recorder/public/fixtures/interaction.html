<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Recorder E2E Fixture</title><body><label>搜索 <input role="combobox" aria-label="搜索" id="search"></label><button id="submit">搜索</button><p id="result" role="status"></p><script>const show=()=>document.querySelector('#result').textContent=`Results for: ${document.querySelector('#search').value}`;document.querySelector('#submit').onclick=show;document.querySelector('#search').onkeydown=e=>{if(e.key==='Enter')show()};</script></body></html>
