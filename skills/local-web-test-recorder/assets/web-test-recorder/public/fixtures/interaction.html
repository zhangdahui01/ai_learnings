<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Recorder E2E Fixture</title><body><label>搜索 <input role="combobox" aria-label="搜索" id="search" name="query"></label><button id="submit" class="primary-action">搜索</button><button id="slow">慢速结果</button><button id="api">加载接口结果</button><span data-testid="loading" hidden>加载中</span><p id="result" role="status"></p><script>const result=document.querySelector('#result');const loading=document.querySelector('[data-testid="loading"]');const show=()=>result.textContent=`Results for: ${document.querySelector('#search').value}`;document.querySelector('#submit').onclick=show;document.querySelector('#search').onkeydown=e=>{if(e.key==='Enter')show()};document.querySelector('#slow').onclick=()=>{loading.hidden=false;setTimeout(()=>{result.textContent='Slow result ready';loading.hidden=true},350)};document.querySelector('#api').onclick=async()=>{loading.hidden=false;try{const response=await fetch('/api/test-fixtures/flaky');result.textContent=response.ok?'API ready':`API ${response.status}`}finally{loading.hidden=true}};</script></body></html>
