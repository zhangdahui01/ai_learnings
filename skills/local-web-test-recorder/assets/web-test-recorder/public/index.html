<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>本地 Web 测试录制器</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><strong>本地 Web 测试录制器</strong><span>Playwright MVP · 数据只保存在当前电脑</span></div><button id="newPlan">+ 测试计划</button><button id="newCase">+ 测试用例</button></header>
<main><aside><h2>测试计划</h2><div id="plans"></div><h2>未归档用例</h2><div id="orphanCases"></div><h2>本地数据</h2><div class="muted"><p><code>data/store.json</code><br>计划、用例、配置和运行记录</p><p><code>recordings/</code><br>录制脚本</p><p><code>artifacts/</code><br>截图、视频和 Trace</p><p>应用不会主动上传这些文件。分享或删除前请检查敏感数据。</p></div></aside><section id="content"><div class="empty"><h1>从一个测试计划开始</h1><p>创建计划 → 创建用例 → 录制/添加步骤 → 回放。</p></div></section></main><template id="stepTemplate"><article class="step"><select class="stepKind"><option value="action">操作</option><option value="assertion">断言</option></select><select class="operation"></select><input class="locator" placeholder="元素定位：如 Email 或 button[type=submit]"><input class="value" placeholder="输入值 / 期望值 / URL"><button class="remove">删除</button></article></template><script type="module" src="/app.js"></script></body></html>
