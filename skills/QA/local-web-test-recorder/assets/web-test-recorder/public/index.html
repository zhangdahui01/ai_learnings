<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>coupayWeb testing · Web 自动化录制回放平台</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/compliance.css">
  <link rel="stylesheet" href="/i18n.css">
  <link rel="stylesheet" href="/bdd-center.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">CW</span><div><strong>coupayWeb testing</strong><small>Coupay Web 录制回放平台</small></div></div>
      <nav id="mainNav" aria-label="主导航">
        <button class="nav-link active" data-view="dashboard"><span>概览</span><b id="navHealth">—</b></button>
        <button class="nav-link" data-view="catalog"><span>资产查询</span><b>⌕</b></button>
        <button class="nav-link" data-view="bdd"><span>BDD Case Center</span><b>AI</b></button>
        <button class="nav-link" data-view="plans"><span>测试计划</span><b id="planCount">0</b></button>
        <button class="nav-link" data-view="suites"><span>测试套件</span><b id="suiteCount">0</b></button>
        <button class="nav-link" data-view="cases"><span>测试用例</span><b id="caseCount">0</b></button>
        <button class="nav-link" data-view="flows"><span>公共流程</span><b id="flowCount">0</b></button>
        <button class="nav-link" data-view="executions"><span>测试执行</span><b id="runCount">0</b></button>
      </nav>
      <div class="storage-card"><strong>数据保存在本机</strong><p><code>data/</code> 元数据<br><code>test-suites/</code> JS/Python<br><code>artifacts/</code> 截图、录像、Trace</p></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><div><p class="eyebrow" id="breadcrumb">测试工作台</p><h1 id="pageTitle">概览</h1></div><div class="top-actions"><label class="locale-switcher" for="uiLocale"><span>界面语言</span><select id="uiLocale" aria-label="界面语言"><option value="zh-CN">中文</option><option value="en">English</option><option value="ko">한국어</option></select></label><button class="btn ghost" id="newCase">新建用例</button><button class="btn primary" id="newPlan">新建计划</button></div></header>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>
  <div id="toastRegion" class="toast-region" aria-live="assertive"></div>
  <script src="/i18n.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
