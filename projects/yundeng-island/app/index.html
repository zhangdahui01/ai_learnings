let AC=null,master=null,mute=false,nextNote=0,noteI=4;
const SC=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880];
function initAudio(){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;
 const d=AC.createDelay();d.delayTime.value=.33;const fb=AC.createGain();fb.gain.value=.35;master.connect(d);d.connect(fb);fb.connect(d);d.connect(AC.destination);master.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,t,dur,vol,type){if(!AC||mute)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}catch(e){}}
function music(){if(!AC||mute)return;const now=AC.currentTime;while(nextNote<now+.3){if(nextNote<now)nextNote=now;
 if(Math.random()<.78){noteI=Math.max(0,Math.min(SC.length-1,noteI+Math.round((Math.random()-.5)*4)));tone(SC[noteI],nextNote,1.6,.09,'triangle');if(Math.random()<.25)tone(SC[noteI]/2,nextNote,2.2,.06);}
 nextNote+=[.42,.42,.84][Math.floor(Math.random()*3)];}}
function chime(big){if(!AC)return;const t=AC.currentTime;(big?[5,7,8,9,8,9]:[5,7,8]).forEach((n,i)=>tone(SC[n],t+i*.11,1.2,.13));}
