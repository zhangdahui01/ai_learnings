[project]
name = "clientx-autopilot"
version = "0.1.0"
description = "AI-driven UI automation and Device Farm harness"
requires-python = ">=3.10"
dependencies = []          # harness, device_farm and code_graph run on the standard library

[project.optional-dependencies]
test = ["pytest>=8"]
graph = ["graphifyy"]
app = ["Appium-Python-Client>=4", "pytest>=8", "pytest-bdd>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "automation/app/tests"]
pythonpath = ["."]
markers = [
  "gated: blocks a merge or a release",
  "P0: priority 0",
  "P1: priority 1",
  "payment: side-effect steps; never retried or auto-repaired",
]
