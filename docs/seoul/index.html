<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Explore Seoul: a bilingual map of Seoul's 42 Michelin-starred restaurants and places worth going.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Explore Seoul</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&family=Noto+Serif+KR:wght@700;900&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: "Seoul after dark". Full-bleed night map; restaurants as labelled jewel pins (cover + name + stars);
   desktop: glass panel of rich cards on the left; phone: swipeable card rail along the bottom. Single dark look by design. */
:root{
  color-scheme:dark;
  --night:#0c0d12; --night-2:#14161e; --glass:rgba(20,22,30,.78); --glass-2:rgba(32,35,46,.86);
  --ink:#f3efe6; --ink-2:#b9b4a8; --ink-3:#7c786f;
  --gold:#d8b46a; --gold-hi:#f4d999; --gold-deep:#9c7a35; --gold-glow:rgba(232,190,100,.55);
  --crimson:#b3263a;
  --river:#16213a; --river-glow:rgba(88,126,210,.35);
  --hair:rgba(243,239,230,.10); --hair-2:rgba(243,239,230,.18);
  --f-display:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
  --f-body:"Jost","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-hangul:"Noto Serif KR","Noto Serif SC",serif;
  --f-cn:"Noto Serif SC",serif;
  --panel:420px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--gold-hi)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:8px}

/* ---------- Leaflet essentials (inlined) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline:0;touch-action:none;font-family:var(--f-body)}
.leaflet-marker-icon,.leaflet-pane>svg path{-webkit-user-select:none;user-select:none}
.leaflet-pane>svg path{pointer-events:none}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:max(16px,env(safe-area-inset-right,0px))}
.leaflet-top .leaflet-control{margin-top:16px}
.leaflet-bar{border-radius:14px;overflow:hidden;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--hair)}
.leaflet-bar a{display:flex;align-items:center;justify-content:center;width:40px;height:40px;color:var(--ink);text-decoration:none;font-size:20px;font-weight:300;border-bottom:1px solid var(--hair)}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a.leaflet-disabled{color:var(--ink-3)}
.leaflet-div-icon{background:none;border:0}

/* ---------- Map + base ---------- */
#map{position:fixed;inset:0;background:
  radial-gradient(1200px 700px at 62% 48%,#171a25 0%,transparent 70%),
  radial-gradient(circle,rgba(243,239,230,.05) 1px,transparent 1.2px) 0 0/22px 22px,
  var(--night)}
.river-glow{filter:drop-shadow(0 0 18px var(--river-glow))}
.lbl{transform:translate(-50%,-50%);text-align:center;white-space:nowrap;pointer-events:none;color:var(--ink-3);font-size:10px;letter-spacing:.32em;text-transform:uppercase}
.lbl b{display:block;font-family:var(--f-cn);font-weight:600;font-size:12px;letter-spacing:.4em;color:rgba(243,239,230,.38)}
.lbl.river{font-family:var(--f-display);font-style:italic;font-size:22px;letter-spacing:.12em;text-transform:none;color:rgba(130,160,230,.45)}

/* ---------- Jewel pins ---------- */
.pin{position:relative;transform:translate(-22px,-22px);display:flex;align-items:center;cursor:pointer;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.pin .av{position:relative;width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;border:2px solid var(--gold-deep);background:var(--night-2);z-index:2;transition:transform .2s}
.pin .av img{width:100%;height:100%;object-fit:cover;display:block}
.pin .tag{margin-left:-18px;padding:5px 14px 5px 24px;border-radius:0 22px 22px 0;background:var(--glass-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--hair-2);border-left:0;white-space:nowrap;line-height:1.15;transition:opacity .2s}
.pin .tag b{display:block;font-weight:500;font-size:13px;letter-spacing:.01em;color:var(--ink)}
.pin .tag i{display:block;font-style:normal;font-size:10.5px;color:var(--gold);letter-spacing:.18em}
.pin.t3 .av{width:52px;height:52px;border-color:var(--gold)}
.pin.t3{transform:translate(-26px,-26px)}
.pin.lit .av{border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(244,217,153,.25),0 0 26px 6px var(--gold-glow)}
.pin.lit .tag{border-color:rgba(244,217,153,.45);background:linear-gradient(90deg,rgba(80,62,28,.92),rgba(30,28,24,.9))}
.pin.lit::after{content:"";position:absolute;left:-6px;top:-6px;width:56px;height:56px;border-radius:50%;border:1px solid var(--gold-hi);animation:ring 2.4s ease-out infinite;pointer-events:none}
.pin.t3.lit::after{width:64px;height:64px}
@keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.6);opacity:0}}
.pin.compact .tag{opacity:0;pointer-events:none}
.pin.compact .av{transform:scale(.42);border-width:3px}
.pin.compact:hover .tag,.pin.sel .tag{opacity:1;pointer-events:auto}
.pin.compact:hover .av,.pin.sel .av{transform:none}
.pin.sel .av{border-color:var(--gold-hi);transform:scale(1.12)}
.pin:hover{z-index:10}
@media (prefers-reduced-motion:reduce){.pin.lit::after{animation:none;opacity:.5}}

/* ---------- Generated cover (unvisited) ---------- */
.cv{position:relative;width:100%;height:100%;overflow:hidden;
  background:
    radial-gradient(120% 90% at 85% 10%,hsla(var(--h),55%,48%,.55),transparent 60%),
    radial-gradient(90% 80% at 0% 100%,hsla(var(--h),45%,22%,.9),transparent 70%),
    linear-gradient(160deg,hsl(var(--h),30%,13%),#0d0e13);
  display:grid;place-items:center}
.cv::before{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(244,217,153,.18);box-shadow:inset 0 0 0 10px rgba(244,217,153,.03)}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.07) 48%,transparent 56%)}
.cv .g{position:relative;font-family:var(--f-hangul);font-weight:900;color:rgba(244,217,153,.92);font-size:var(--gs,40px);line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.av .cv{--gs:19px}.av .cv::before{inset:8%}

/* ---------- Glass panel (desktop) ---------- */
.panel{position:fixed;z-index:1100;top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));width:var(--panel);display:flex;flex-direction:column;border-radius:24px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--hair);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.hd{padding:22px 24px 16px;display:grid;gap:16px;border-bottom:1px solid var(--hair)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:500;font-size:34px;line-height:.95;letter-spacing:.01em;margin:0}
.brand i{color:var(--gold);font-weight:500}
.brand small{display:block;font-family:var(--f-body);font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.tog{display:inline-flex;border:1px solid var(--hair-2);border-radius:999px;padding:2px}
.tog button{padding:5px 10px;border-radius:999px;font-size:11.5px;letter-spacing:.08em;color:var(--ink-2)}
.tog button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.prog{display:grid;grid-template-columns:86px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:86px;height:86px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .n b{font-family:var(--f-display);font-size:36px;font-weight:600;color:var(--gold-hi);display:block}
.ring .n small{font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.tiers{display:grid;gap:7px}
.tier{display:grid;grid-template-columns:42px 1fr 36px;gap:10px;align-items:center;font-size:11.5px}
.tier .st{color:var(--gold);letter-spacing:2px;font-size:11px}
.tier .bar{height:3px;background:var(--hair);border-radius:3px;overflow:hidden}
.tier .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold-hi))}
.tier .c{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.layers{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair-2);border-radius:14px;padding:3px}
.layers button{padding:8px 0;border-radius:11px;font-size:13px;letter-spacing:.04em;color:var(--ink-2)}
.layers button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(216,180,106,.22),rgba(216,180,106,.08));color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(216,180,106,.35)}
.fl{display:flex;gap:6px;overflow-x:auto;padding:12px 24px;border-bottom:1px solid var(--hair);scrollbar-width:none}
.fl::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--hair-2);font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip .st{color:var(--gold);letter-spacing:1px}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:rgba(216,180,106,.12)}
.search{flex:none;width:130px;border:1px solid var(--hair-2);border-radius:999px;background:transparent;padding:6px 13px;font:inherit;font-size:12px;color:var(--ink)}
.search::placeholder{color:var(--ink-3)}
.cards{flex:1;overflow-y:auto;padding:10px 12px 24px;display:grid;gap:4px;align-content:start}
.sec{padding:16px 12px 6px;display:flex;align-items:baseline;justify-content:space-between;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.sec .st{color:var(--gold);letter-spacing:3px;font-size:12px;margin-right:8px}
.card{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;text-align:left;padding:8px;border-radius:16px;transition:background .2s}
.card:hover,.card.active{background:rgba(243,239,230,.06)}
.card .cover{width:92px;height:92px;border-radius:12px;overflow:hidden;position:relative;background:var(--night-2)}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .cover .cv{--gs:34px}
.lit-badge{position:absolute;left:6px;bottom:6px;font-size:9.5px;letter-spacing:.14em;padding:2px 7px;border-radius:999px;background:rgba(12,13,18,.75);color:var(--gold-hi);border:1px solid rgba(244,217,153,.45)}
.card .info{min-width:0;display:grid;gap:2px}
.card .stars{color:var(--gold);font-size:11px;letter-spacing:3px}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ko{font-size:12px;color:var(--ink-2)}
.card .meta{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new{font-family:var(--f-body);font-size:9px;letter-spacing:.16em;color:var(--crimson);border:1px solid var(--crimson);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:4px;font-weight:600}
.panel-foot{padding:10px 24px 14px;font-size:10.5px;color:var(--ink-3);border-top:1px solid var(--hair)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h4{font-family:var(--f-cn);font-weight:900;font-size:20px;color:var(--ink);margin:0 0 10px}

/* ---------- Rail (phone) ---------- */
.mtop,.rail,.mlist-btn{display:none}

/* ---------- Detail sheet ---------- */
.sheet{position:fixed;z-index:1300;top:16px;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:min(500px,calc(100% - 32px));border-radius:24px;overflow:hidden;background:#111219;border:1px solid var(--hair);box-shadow:0 30px 90px rgba(0,0,0,.6);display:flex;flex-direction:column;transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-scroll{overflow-y:auto;flex:1}
.hero{position:relative;height:320px;flex:none;background:var(--night-2)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .cv{--gs:120px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,18,.35) 0%,transparent 30%,transparent 50%,#111219 100%);pointer-events:none}
.hero .x{position:absolute;top:14px;right:14px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(12,13,18,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--hair-2);font-size:20px;font-weight:300}
.hero .hint{position:absolute;left:16px;top:16px;z-index:3;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);background:rgba(12,13,18,.55);padding:5px 10px;border-radius:999px}
.dbody{position:relative;margin-top:-90px;z-index:2;padding:0 28px 40px}
.d-stars{color:var(--gold-hi);letter-spacing:6px;font-size:16px;text-shadow:0 0 12px var(--gold-glow)}
.d-name{font-family:var(--f-display);font-weight:600;font-size:52px;line-height:.95;margin:8px 0 4px;text-wrap:balance}
.d-ko{font-family:var(--f-hangul);font-weight:700;font-size:16px;color:var(--ink-2)}
.d-sub{margin-top:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:7px 14px;border-radius:999px;font-size:12.5px;letter-spacing:.06em;border:1px solid var(--hair-2);color:var(--ink-2)}
.status.lit{border-color:rgba(244,217,153,.5);color:var(--gold-hi);background:rgba(216,180,106,.1)}
.d-intro{font-size:15.5px;line-height:1.7;color:var(--ink);margin:22px 0 14px;max-width:62ch}
.hl{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px}
.hl li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px;color:var(--ink-2)}
.hl li::before{content:"✦";color:var(--gold);font-size:11px;padding-top:3px}
.go{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}@media(max-width:420px){.go{grid-template-columns:repeat(2,1fr)}}.go button{cursor:pointer;font:inherit}
.go a,.go button{text-align:center;padding:11px 6px;border-radius:12px;border:1px solid var(--hair-2);text-decoration:none;color:var(--ink);font-size:12.5px;letter-spacing:.04em}
.go a.p,.go button.p{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1408;border-color:transparent;font-weight:500}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0 0 30px;padding:18px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:14px}
.facts dt{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);padding-top:3px;white-space:nowrap}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.copy{color:var(--gold);font-size:12px;padding-left:8px}
.h2{font-family:var(--f-cn);font-weight:900;font-size:22px;margin:0 0 4px}
.h2-sub{font-size:11px;letter-spacing:.2em;color:var(--ink-3);margin-bottom:14px;text-transform:uppercase}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:22px}
.gal button{aspect-ratio:1;border-radius:10px;overflow:hidden;max-width:100%;background:var(--night-2)}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gal button:hover img{transform:scale(1.06)}
.lbl-s{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.notes{font-size:15px;line-height:1.7;white-space:pre-wrap;margin:0 0 22px}
.notes.pending{color:var(--ink-3);font-style:italic;font-size:13.5px;border:1px dashed var(--hair-2);border-radius:14px;padding:14px 16px}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:20px}
.rate{border:1px solid var(--hair);border-radius:12px;padding:10px 12px;font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
.rate b{display:block;color:var(--gold-hi);font-size:14px;letter-spacing:3px;margin-top:2px}
.menu{list-style:none;margin:0;padding:6px 0;counter-reset:c;border-top:1px solid var(--hair)}
.menu li{counter-increment:c;display:grid;grid-template-columns:34px 1fr;padding:11px 0;border-bottom:1px solid var(--hair)}
.menu li::before{content:counter(c,decimal-leading-zero);font-family:var(--f-display);font-size:18px;color:var(--gold);line-height:1.2}
.menu span{font-family:var(--f-display);font-size:19px;font-weight:500;line-height:1.2}
.menu small{grid-column:2;color:var(--ink-3);font-size:12px}

.review{position:relative;border:1px solid rgba(216,180,106,.28);background:linear-gradient(160deg,rgba(216,180,106,.08),transparent 60%);border-radius:18px;padding:18px 18px 8px;margin-bottom:28px}
.review.pending{border-style:dashed;background:none}
.review .score{position:absolute;right:18px;top:12px;display:flex;align-items:baseline;gap:4px}
.review .score b{font-family:var(--f-display);font-size:44px;font-weight:600;color:var(--gold-hi);line-height:1}
.review .score span{font-size:12px;color:var(--ink-3)}
.headline{font-family:var(--f-display);font-style:italic;font-size:24px;line-height:1.2;margin:0 0 10px;padding-right:90px}
.review .notes.pending{border:0;padding:0}
.best{display:flex;gap:10px;align-items:baseline;margin:4px 0 14px;font-family:var(--f-display);font-size:19px}
.best span{font-family:var(--f-body);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.facts.slim{margin:0 0 10px;padding:12px 0 4px;border-bottom:0}
.menu-hint{font-size:13px;color:var(--ink-3);margin:-4px 0 12px}
.courses{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.courses li{padding:14px 0;border-bottom:1px solid var(--hair)}
.courses li.fav .c-name i{color:var(--gold-hi);font-style:normal}
.c-h{display:grid;grid-template-columns:36px 1fr;gap:4px}
.c-n{font-family:var(--f-display);font-size:20px;color:var(--gold);line-height:1.15}
.c-name{font-family:var(--f-display);font-size:21px;font-weight:500;line-height:1.15}
.c-ko{font-size:12px;color:var(--ink-3);margin-top:2px}
.c-note{margin:8px 0 0 36px;font-size:14px;color:var(--ink-2);line-height:1.6}
.strip{display:flex;gap:8px;overflow-x:auto;margin:10px 0 2px 36px;padding-bottom:4px;scrollbar-width:thin}
.mt{position:relative;flex:none;width:132px;height:132px;border-radius:12px;overflow:hidden;background:var(--night-2)}
.mt img,.gal button img{width:100%;height:100%;object-fit:cover;display:block}
.gal button{position:relative}
.play{position:absolute;inset:auto auto 8px 8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;padding-left:2px;background:rgba(12,13,18,.7);border:1px solid rgba(244,217,153,.6);color:var(--gold-hi)}

function riverPoly(line,halfKm){const kLat=1/111,kLng=1/88.2,l=[],r=[];
  for(let i=0;i<line.length;i++){const a=line[Math.max(0,i-1)],b=line[Math.min(line.length-1,i+1)];
    let dy=(b[0]-a[0])/kLat,dx=(b[1]-a[1])/kLng;const n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;
    l.push([line[i][0]+dx*halfKm*kLat,line[i][1]-dy*halfKm*kLng]);r.push([line[i][0]-dx*halfKm*kLat,line[i][1]+dy*halfKm*kLng]);}
  return l.concat(r.reverse());}
const AREAS=[[37.5796,126.977,'景福宫','Gyeongbokgung'],[37.5705,126.992,'钟路','Jongno'],[37.5612,126.984,'明洞','Myeongdong'],[37.5512,126.9882,'南山','Namsan'],[37.5385,126.996,'梨泰院','Itaewon'],[37.5563,126.9236,'弘大','Hongdae'],[37.5245,126.9245,'汝矣岛','Yeouido'],[37.5446,127.056,'圣水','Seongsu'],[37.5285,127.024,'狎鸥亭','Apgujeong'],[37.5175,127.052,'清潭','Cheongdam'],[37.4979,127.0276,'江南','Gangnam'],[37.5133,127.1001,'蚕室','Jamsil'],[37.5,127.002,'瑞草','Seocho']];

function visible(){ const src=layer==='michelin'?places:spots; return src.filter(matches); }
function drawPins(){
  if(!pinLayer) return; pinLayer.clearLayers(); markers={};
  visible().filter(p=>typeof p.lat==='number').forEach(p=>{
    const lit=isLit(p.id);
    const html=`<div class="pin t${p.stars||1} ${lit?'lit':''} ${selected===p.id?'sel':''}" data-id="${esc(p.id)}"><span class="av">${cover(p)}</span><span class="tag"><b>${esc(pname(p))}</b><i>${isSpot(p)?esc(catLabel(p))+(p.status==='want'?' · '+esc(t('want')):''):stars(p.stars)}</i></span></div>`;
    const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',iconSize:[0,0],html}),zIndexOffset:(lit?3000:0)+(p.stars||1)*500+(selected===p.id?6000:0),title:p.name_en,keyboard:true}).on('click',e=>{L.DomEvent.stopPropagation(e);openPlace(p.id);});
    m.addTo(pinLayer); markers[p.id]=m;

function declutter(){
  if(!map) return;
  const ids=Object.keys(markers).sort((a,b)=>{const A=byId[a],B=byId[b];return (b===selected)-(a===selected)||isLit(b)-isLit(a)||(B.stars||0)-(A.stars||0);});
  const placed=[], z=map.getZoom();
  ids.forEach(id=>{
    const m=markers[id], el=m.getElement()?.firstElementChild; if(!el) return;
    const p=map.latLngToContainerPoint(m.getLatLng()), name=pname(byId[id]);
    const w=48+Math.min(name.length,24)*7.4+30, box={x1:p.x-24,y1:p.y-24,x2:p.x-24+w,y2:p.y+24};
    const hit=placed.some(b=>!(box.x2<b.x1||box.x1>b.x2||box.y2<b.y1||box.y1>b.y2));
    const compact=hit||(z<12.25&&!isSpot(byId[id])&&byId[id].stars<2&&!isLit(id));
    el.classList.toggle('compact',compact);
    placed.push(compact?{x1:p.x-9,y1:p.y-9,x2:p.x+9,y2:p.y+9}:box);
  });
}
function fitAll(){ const pts=(layer==='spots'&&spots.length?spots:places).filter(p=>typeof p.lat==='number').map(p=>[p.lat,p.lng]); if(!pts.length) return;

function matches(p){
  if(layer==='michelin'){ if(tierF!=='all'&&String(p.stars)!==tierF) return false; }
  else { if(catF!=='all'&&p.category!==catF) return false; if(visitF==='want'&&p.status!=='want') return false; }
  if(visitF==='lit'&&!isLit(p.id)) return false;
  if(visitF==='todo'&&isLit(p.id)) return false;
  if(!query) return true;
  return [p.name_en,p.name_ko,p.name_zh,p.category&&t('cat_'+p.category),p.cuisine_en,p.cuisine_zh,p.area_en,p.area_zh,p.chef].join(' ').toLowerCase().includes(query.toLowerCase());
}

function chipsHtml(withSearch){
  const c=(lab,attr,v,cur)=>`<button class="chip" data-${attr}="${v}" aria-pressed="${cur===v}">${lab}</button>`;
  const srch=withSearch?`<input class="search" id="q" type="search" autocomplete="off" placeholder="${esc(t('search'))}" value="${esc(query)}">`:'';

    c(esc(t('been')),'visit','lit',visitF)+c(esc(t('want')),'visit','want',visitF)+srch;
  return c(esc(t('all')),'tier','all',tierF)+c('<span class="st">★★★</span>','tier','3',tierF)+c('<span class="st">★★</span>','tier','2',tierF)+c('<span class="st">★</span>','tier','1',tierF)+
    c(esc(t('visited')),'visit','lit',visitF)+c(esc(t('todo')),'visit','todo',visitF)+
    (withSearch?`<input class="search" id="q" type="search" autocomplete="off" placeholder="${esc(t('search'))}" value="${esc(query)}">`:'');

function cardHtml(p,cls){

    <span class="cover">${cover(p)}${badge?`<span class="lit-badge ${lit?'':'want'}">${badge}</span>`:''}</span>
    <span class="info"><span class="stars">${isSpot(p)?esc(catLabel(p)):stars(p.stars)}</span><h3>${esc(pname(p))}${p.new_2026?'<span class="new">NEW</span>':''}</h3><span class="ko">${esc([lang==='zh'&&p.name_zh?p.name_en:'',p.name_ko].filter(Boolean).join(' · '))}</span><span class="meta">${esc(meta)}</span></span></button>`;

function renderCards(){
  const el=$('#cards');
  if(layer==='spots'){
    if(!spots.length){ el.innerHTML=`<div class="empty"><h4>${esc(t('spotsEmptyH'))}</h4><p>${esc(t('spotsEmpty'))}</p></div>`; return; }
    const out=[]; Object.keys(CAT).forEach(c=>{ const items=spots.filter(p=>p.category===c&&matches(p)).sort((a,b)=>(isLit(b.id)-isLit(a.id))||((b.status==='want')-(a.status==='want'))||pname(a).localeCompare(pname(b)));
      if(!items.length) return; out.push(`<div class="sec"><span>${esc(t('cat_'+c))}</span><span>${items.length}</span></div>`); items.forEach(p=>out.push(cardHtml(p,'card'))); });

  });

    L.polyline([[o.lat,o.lng],[p.lat,p.lng]],{color:'#f4d999',weight:2,dashArray:'6 8',opacity:.9,interactive:false}),
    L.marker([o.lat,o.lng],{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="opin"><span>${esc(o.name.slice(0,1))}</span><b>${esc(o.name)}</b></div>`})})
  ]).addTo(map);
}
function startPick(cb){
  pickCb=cb; $('#pickBar').hidden=false; document.body.classList.add('picking');
  $('#sheet').classList.add('peek'); $('#panel').classList.remove('open');
}
function endPick(){ pickCb=null; $('#pickBar').hidden=true; document.body.classList.remove('picking'); $('#sheet').classList.remove('peek'); }
document.addEventListener('click',e=>{
  if(e.target.closest('[data-goroute]')){ const b=$('#routeBox'); if(!curOrigin()&&!formOpen){ formOpen=true; formPre=null; renderRouteBox(); } b?.scrollIntoView({behavior:'smooth',block:'start'}); setTimeout(()=>$('#oName')?.focus(),400); return; }
  const os=e.target.closest('[data-origin]'); if(os){ originSel=os.dataset.origin; saveOrigins(); renderRouteBox(); return; }
  const od=e.target.closest('[data-odel]'); if(od){ origins=origins.filter(o=>o.id!==od.dataset.odel); if(originSel===od.dataset.odel) originSel=origins[0]?.id||null; saveOrigins(); renderRouteBox(); return; }
  if(e.target.closest('[data-oadd]')){ formOpen=true; formPre=null; renderRouteBox(); $('#oName')?.focus(); return; }
  if(e.target.closest('[data-ocancel]')){ formOpen=false; renderRouteBox(); return; }
  if(e.target.closest('[data-opick]')){ formPre={name:$('#oName').value, where:$('#oWhere').value};
    startPick(ll=>{ formPre.where=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`; renderRouteBox(); }); return; }
  if(e.target.closest('#pickBar')){ endPick(); return; }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='oform') return; e.preventDefault();
  const name=$('#oName').value.trim(), w=parseWhere($('#oWhere').value); if(!name||!w) { $('#oWhere').focus(); return; }
  const o={id:'o'+Date.now().toString(36), name, ...w}; origins.push(o); originSel=o.id; formOpen=false; saveOrigins(); renderRouteBox();
});

/* rail ↔ map: centred card highlights its pin */
let railT;
$('#rail').addEventListener('scroll',()=>{ clearTimeout(railT); railT=setTimeout(()=>{
  const r=$('#rail'), mid=r.scrollLeft+r.clientWidth/2; let best=null,d=1e9;
  [...r.children].forEach(c=>{const cm=c.offsetLeft+c.offsetWidth/2; if(Math.abs(cm-mid)<d){d=Math.abs(cm-mid);best=c;}});
  if(!best||!map) return; const p=byId[best.dataset.open]; if(!p) return;
  $$('.pin.sel').forEach(e=>e.classList.remove('sel')); markers[p.id]?.getElement()?.firstElementChild?.classList.add('sel');
  map.panTo([p.lat,p.lng],{animate:true,duration:.5});
},140); },{passive:true});

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){ openPlace(o.dataset.open); return; }
  const l=e.target.closest('[data-lang]'); if(l){ lang=l.dataset.lang; try{localStorage.setItem('es-lang',lang);}catch(_){} renderAll(); return; }
  const y=e.target.closest('[data-layer]'); if(y){ layer=y.dataset.layer; visitF='all'; query=''; closeSheet(); renderAll(); if(map) fitAll(); return; }
  const cf=e.target.closest('[data-cat]'); if(cf){ catF=cf.dataset.cat; renderPanel(); drawPins(); return; }
  const tf=e.target.closest('[data-tier]'); if(tf){ tierF=tf.dataset.tier; renderPanel(); drawPins(); return; }
  const vf=e.target.closest('[data-visit]'); if(vf){ visitF=visitF===vf.dataset.visit?'all':vf.dataset.visit; renderPanel(); drawPins(); return; }
  const lb=e.target.closest('[data-lb]'); if(lb){ lbIdx=+lb.dataset.lb; showLb(); $('#lb').hidden=false; return; }
  const cp=e.target.closest('[data-copy]'); if(cp){ navigator.clipboard?.writeText(cp.dataset.copy).then(()=>toast(t('copied')),()=>{}); return; }
});
$('#mlistBtn').addEventListener('click',()=>$('#panel').classList.add('open'));
$('.grab').addEventListener('click',()=>$('#panel').classList.remove('open'));
$('#lbClose').addEventListener('click',closeLb);
$('#lbPrev').addEventListener('click',()=>{lbIdx--;showLb();});
$('#lbNext').addEventListener('click',()=>{lbIdx++;showLb();});
$('#lb').addEventListener('click',e=>{ if(e.target.id==='lb') closeLb(); });
document.addEventListener('keydown',e=>{
  if(!$('#lb').hidden){ if(e.key==='Escape')closeLb(); if(e.key==='ArrowLeft'){lbIdx--;showLb();} if(e.key==='ArrowRight'){lbIdx++;showLb();} return; }
  if(e.key==='Escape'){ if(selected) closeSheet(); else $('#panel').classList.remove('open'); }
});
/* ---------- Footprints (足迹) ---------- */
let bOpen=false, footprints=[], trailOn=false, trailLayer=null, trailSel=null, bases={}, bEdit=null;
const LT=(zh,en)=>lang==='zh'?zh:en;
const BASES=[['hotel','🏨','酒店','Hotel'],['hq','🏢','HJ Tower','HJ Tower'],['ep','🏙️','EP Tower','EP Tower']];
function loadBases(){ try{ bases=JSON.parse(localStorage.getItem('es-bases')||'{}')||{}; }catch(e){ bases={}; }
  const m=location.hash.match(/bases=([A-Za-z0-9_\-]+)/);
  if(m){ try{ const s=atob(m[1].replace(/-/g,'+').replace(/_/g,'/')); const j=JSON.parse(decodeURIComponent(escape(s)));
      Object.assign(bases,j); saveBases(); trailOn=true; history.replaceState(null,'',location.pathname+location.search); toast(LT('已把你的 3 个据点存到这台设备','Your places were saved on this device')); }catch(e){} } }
function saveBases(){ try{ localStorage.setItem('es-bases',JSON.stringify(bases)); }catch(e){} }
function today(){ const d=new Date(Date.now()+9*3600e3); return d.toISOString().slice(0,10); }
function fpList(){ const seen=new Set(footprints.map(f=>f.place_id));
  const extra=spots.filter(s=>s.status==='visited'&&!seen.has(s.id)).map(s=>({place_id:s.id,date:s.visited_date||'',time:'',meal:''}));
  return footprints.concat(extra).map(f=>({...f,p:byId[f.place_id]})).filter(f=>f.p&&typeof f.p.lat==='number').sort((a,b)=>((a.date||'0')+a.time).localeCompare((b.date||'0')+b.time)); }
function nowKST(){ return new Date(Date.now()+9*3600e3).toISOString().slice(0,16).replace('T',' '); }
function fpStatus(f){ if(!f.date) return 'past'; const td=today(), when=f.date+' '+(f.time||'23:59');
  if(when<=nowKST()) return 'past'; return f.date===td?'today':'future'; }
function fmtDate(f){ if(!f.date) return LT('去过','Visited')+(isSpot(f.p)?' · '+catLabel(f.p):''); const wdI=new Date(f.date+'T12:00:00Z').getUTCDay(), wd=(lang==='zh'?'日一二三四五六'.split(''):['Sun','Mon','Tue','Wed','Thu','Fri','Sat'])[wdI];
  const md=`${+f.date.slice(5,7)}/${+f.date.slice(8,10)}`, meal=LT({lunch:'午餐',dinner:'晚餐'}[f.meal]||'',f.meal||'');
  const tail=meal||(isSpot(f.p)?catLabel(f.p):'');
  return lang==='zh'?`${md} 周${wd} ${f.time||''} ${tail}`.replace(/  +/g,' '):`${wd} ${md} ${f.time||''} ${tail}`.replace(/  +/g,' '); }
function distRows(p){
  const set=BASES.filter(([k])=>bases[k]&&typeof bases[k].lat==='number');
  if(!set.length) return `<span class="none">${esc(LT('在下面设置酒店 / HJ Tower / EP Tower，就能看到距离','Set your hotel / HJ Tower / EP Tower below to see distances'))}</span>`;
  return set.map(([k,ic,zh,en])=>{ const d=km(bases[k],p), e=estimates(d);
    return `<div><span>${ic} ${esc(bases[k].label||LT(zh,en))}</span><span>${esc(LT('地铁','Transit'))}${e.transit}${esc(LT('分','m'))} · ${esc(LT('打车','Taxi'))}${e.taxi}${esc(LT('分','m'))}</span><strong>${d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km'}</strong></div>`; }).join('');
}
function renderTrailCard(){
  let card=$('#tcard'); if(!trailOn){ card&&card.remove(); return; }
  if(!card){ card=document.createElement('div'); card.id='tcard'; card.className='tcard'; document.body.appendChild(card); }
  const L=fpList(), n=L.filter(f=>fpStatus(f)==='past').length;
  card.innerHTML=`<button class="x" data-trail-close aria-label="close">×</button>
    <h3>👣 ${esc(LT('我的足迹','My footprints'))} <small>${n} ${esc(LT('站已到达','visited'))}${L.length>n?` · ${L.length-n} ${esc(LT('站计划中','planned'))}`:''}</small></h3>
    <p class="sub">${esc(LT('直线距离；时间为粗估。点一下卡片看连线，再点打开餐厅','Straight-line distance, rough times. Tap a card for lines, tap again to open'))}</p>
    ${isPhone()&&L.length>1?`<div class="tchips">${L.map((f,i)=>`<button data-fp="${esc(f.place_id)}" aria-pressed="${trailSel===f.place_id}">${i+1} · ${esc(pname(f.p))}</button>`).join('')}</div>`:''}
    ${L.slice().reverse().filter(f=>!isPhone()||!trailSel||f.place_id===trailSel).map((f,i)=>{ const st=fpStatus(f), idx=L.indexOf(f)+1;
      return `<div class="tstop ${st!=='past'?'next':''} ${trailSel===f.place_id?'on':''}" data-fp="${esc(f.place_id)}">
        <span class="n">${idx}</span>
        <div class="d">${esc(fmtDate(f))}${st==='today'?`<em>${esc(LT('今天','Today'))}</em>`:st==='future'?`<em>${esc(LT('计划','Planned'))}</em>`:''}</div>
        <b>${esc(pname(f.p))}<i>${'★'.repeat(f.p.stars||0)}</i></b>
        <div class="dist">${distRows(f.p)}</div></div>`; }).join('')}
    <div class="bases ${isPhone()&&!bOpen&&!bEdit?'shut':''}"><h4 data-btoggle>${esc(LT('我的据点（只保存在这台设备上，别人看不到）','My places (saved on this device only — others can’t see them)'))}${isPhone()?` <span>${bOpen||bEdit?'▾':'▸'}</span>`:''}</h4>
      ${BASES.map(([k,ic,zh,en])=>{ const b=bases[k];
        return `<div class="brow"><span class="ic">${ic}</span><span class="nm">${esc(LT(zh,en))}<small>${b?esc(b.addr||`${b.lat.toFixed(4)}, ${b.lng.toFixed(4)}`):esc(LT('未设置','Not set'))}</small></span>
          <button data-bedit="${k}">${esc(b?LT('修改','Edit'):LT('设置','Set'))}</button>${b?`<button data-bdel="${k}" aria-label="remove">×</button>`:''}</div>
          ${bEdit===k?`<div class="bform"><input id="bIn" placeholder="${esc(LT('粘贴 Google 地图链接或坐标 37.51,127.10','Paste a Google Maps link or 37.51,127.10'))}"><button class="p" data-bsave="${k}">${esc(LT('保存','Save'))}</button><button data-bpick="${k}">⌖ ${esc(LT('地图上点选','Pick on map'))}</button>${origins.length?origins.filter(o=>typeof o.lat==='number').map((o,i)=>`<button data-bfrom="${k}:${i}">${esc(o.name)}</button>`).join(''):''}</div>`:''}`; }).join('')}
      <p class="bnote">${esc(LT('提示：在 Google 地图长按地点 → 分享 → 复制链接，粘贴到这里即可。','Tip: in Google Maps long-press a place → Share → copy link, then paste it here.'))}</p></div>`;
}
function drawTrail(){
  if(!map) return; if(trailLayer){ trailLayer.remove(); trailLayer=null; }
  const bl=L.layerGroup();
  BASES.forEach(([k,ic,zh,en])=>{ const b=bases[k]; if(!b||typeof b.lat!=='number') return;
    L.marker([b.lat,b.lng],{zIndexOffset:9000,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="bpin">${ic}</div><span class="blbl">${esc(b.label||LT(zh,en))}</span>`})}).addTo(bl); });
  if(trailOn){
    const F=fpList();
    for(let i=0;i<F.length-1;i++){ const a=F[i].p,b=F[i+1].p, lit=fpStatus(F[i+1])==='past';
      L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:lit?'#f4d999':'#6b6f80',weight:lit?2.5:1.5,opacity:lit?.9:.6,dashArray:lit?'1 8':'3 9',lineCap:'round',interactive:false,className:lit?'trail-lit':''}).addTo(bl);
      [.33,.66].forEach(t=>L.marker([a.lat+(b.lat-a.lat)*t,a.lng+(b.lng-a.lng)*t],{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="step ${lit?'lit':''}">👣</div>`})}).addTo(bl)); }
    F.forEach((f,i)=>{ const st=fpStatus(f);
      L.marker([f.p.lat,f.p.lng],{zIndexOffset:12000,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="fp ${st!=='past'?'next':'lit'}">👣<i>${i+1}</i></div>`})}).on('click',e=>{L.DomEvent.stopPropagation(e);selectFp(f.place_id);}).addTo(bl); });
    const s=trailSel&&byId[trailSel];
    if(s) BASES.forEach(([k])=>{ const b=bases[k]; if(!b||typeof b.lat!=='number') return; const d=km(b,s);
      L.polyline([[b.lat,b.lng],[s.lat,s.lng]],{color:'#8fb0ff',weight:1.5,opacity:.7,dashArray:'4 6',interactive:false}).addTo(bl);
      L.marker([(b.lat+s.lat)/2,(b.lng+s.lng)/2],{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="dlbl">${d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km'}</div>`})}).addTo(bl); });
  }
  trailLayer=bl.addTo(map);
}
function fitTrail(){ if(!map) return; const pts=fpList().map(f=>[f.p.lat,f.p.lng]).concat(BASES.map(([k])=>bases[k]).filter(b=>b&&typeof b.lat==='number').map(b=>[b.lat,b.lng]));
  if(!pts.length) return; const ph=isPhone();
  map.fitBounds(pts,{paddingTopLeft:ph?[30,140]:[$('#panel').offsetWidth+40+440,60],paddingBottomRight:ph?[30,Math.round(innerHeight*.5)]:[80,60],maxZoom:14.5}); }
function selectFp(id){ trailSel=(trailSel===id&&!isPhone())?null:id; renderTrailCard(); drawTrail(); }
function setTrail(on){ trailOn=on; if(!on){ trailSel=null; bEdit=null; } else if(!trailSel){ const F=fpList(); const nx=F.find(f=>fpStatus(f)!=='past')||F[F.length-1]; trailSel=nx?nx.place_id:null; }
  $('#trailBtn').setAttribute('aria-pressed',on); document.body.classList.toggle('trailing',on); renderTrailCard(); drawTrail(); if(on) fitTrail(); }
function renderTrailBtn(){ $('#trailBtn').innerHTML=`👣 ${esc(LT('足迹','Footprints'))}`; $('#trailBtn').setAttribute('aria-pressed',trailOn); }
document.addEventListener('click',e=>{
  const g=k=>e.target.closest(k);
  if(g('#trailBtn')){ setTrail(!trailOn); return; }
  if(g('[data-trail-close]')){ setTrail(false); return; }
  if(g('[data-btoggle]')){ bOpen=!bOpen; renderTrailCard(); return; }
  let el;
  if((el=g('[data-bedit]'))){ bEdit=bEdit===el.dataset.bedit?null:el.dataset.bedit; renderTrailCard(); setTimeout(()=>$('#bIn')?.focus(),50); return; }
  if((el=g('[data-bdel]'))){ delete bases[el.dataset.bdel]; saveBases(); renderTrailCard(); drawTrail(); return; }
  if((el=g('[data-bsave]'))){ const r=parseWhere($('#bIn')?.value); if(!r||typeof r.lat!=='number'){ toast(LT('没认出坐标，请粘贴 Google 地图链接或 "37.51,127.10"','Couldn’t read coordinates — paste a Google Maps link or "37.51,127.10"')); return; }
    bases[el.dataset.bsave]={lat:r.lat,lng:r.lng}; saveBases(); bEdit=null; renderTrailCard(); drawTrail(); fitTrail(); return; }
  if((el=g('[data-bfrom]'))){ const [k,i]=el.dataset.bfrom.split(':'); const o=origins.filter(o=>typeof o.lat==='number')[+i];
    bases[k]={lat:o.lat,lng:o.lng,addr:o.name}; saveBases(); bEdit=null; renderTrailCard(); drawTrail(); fitTrail(); return; }
  if((el=g('[data-bpick]'))){ const k=el.dataset.bpick; $('#tcard').style.display='none';
    startPick(ll=>{ bases[k]={lat:+ll.lat.toFixed(6),lng:+ll.lng.toFixed(6)}; saveBases(); bEdit=null; $('#tcard').style.display=''; renderTrailCard(); drawTrail(); }); return; }
  if((el=g('[data-fp]'))){ if(el.classList.contains('tstop')&&(e.detail>1||trailSel===el.dataset.fp)){ openPlace(el.dataset.fp); return; } selectFp(el.dataset.fp);
    const p=byId[el.dataset.fp]; map&&map.panTo([p.lat,p.lng]); return; }
});
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); id&&byId[id]?openPlace(id,true):(selected&&closeSheet()); });
window.addEventListener('resize',()=>{ map&&map.invalidateSize(); declutter(); });

(async()=>{
  renderStatic();
  if(window.L) initMap();
  await load();
  loadBases();
  if(map) fitAll();
  renderAll();
  if(trailOn) setTrail(true);
  const id=location.hash.slice(1); if(id&&byId[id]) openPlace(id,true);
})();
})();
</script>
