  const r = REG.get(id); if(r){ Object.assign(base, {kind:r.kind, date:r.date, title:r.title, url:r.url, category:r.category, author:r.author}); }
  const next = fn(base); next.updatedAt = Date.now();
  S.marks.set(id, next); render();
  const prev = queues.get(id) || Promise.resolve();
  const job = prev.then(() => db.collection("marks").doc(id).set(next)).catch(e => { toast("没保存上，请重试"); console.error(e); });
  queues.set(id, job);
}

function actions(id, opts={}){
  const m = markOf(id) || {};
  const ro = S.canWrite ? "" : " disabled";
  const votes = m.votes||0, nn = (m.notes||[]).length;
  const r = REG.get(id);
  let h = `<div class="acts">
    <button class="act ${m.later&&!m.done?"on-later":""}" data-act="later" data-id="${esc(id)}" aria-pressed="${!!(m.later&&!m.done)}"${ro}>${ICON.later}${m.later&&!m.done?"已加入稍后读":"稍后读"}</button>
    <button class="act ${m.fav?"on-fav":""}" data-act="fav" data-id="${esc(id)}" aria-pressed="${!!m.fav}"${ro}>${m.fav?ICON.favOn:ICON.fav}${m.fav?"已收藏":"收藏"}</button>
    <button class="act ${votes?"on-up":""}" data-act="up" data-id="${esc(id)}" title="加一分，进入排行榜"${ro}>${ICON.up}+1${votes?` · ${votes}`:""}</button>
    <button class="act" data-act="notes" data-id="${esc(id)}" aria-expanded="${S.open.has(id)}">${ICON.note}笔记${nn?` · ${nn}`:""}</button>`;
  if(opts.toLib && r && r.kind!=="lib"){
    const inLib = S.lib.some(l => (l.src && l.src===id) || (l.url && r.url && l.url===r.url));
    if(inLib) h += `<button class="act on-lib" disabled aria-pressed="true">${ICON.libOn}已在武器库</button>`;
    else if(S.canWrite) h += `<button class="act" data-act="tolib" data-id="${esc(id)}">${ICON.lib}存入武器库</button>`;
  }
  if(opts.extra) h += opts.extra;
  if(r && safeUrl(r.url) && opts.src!==false) h += `<a class="src" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">打开原文 ↗</a>`;
  h += `</div>`;
  if(S.open.has(id)) h += notesBox(id);
  return h;
}
function notesBox(id){
  const notes = (markOf(id)?.notes)||[];
  return `<div class="notes">
    ${notes.length?`<ul>${notes.map((n,i)=>`<li><time>${fmt(n.at)}</time><span>${esc(n.t)}</span>${S.canWrite?`<button data-act="delnote" data-id="${esc(id)}" data-i="${i}" aria-label="删除这条笔记">删除</button>`:""}</li>`).join("")}</ul>`:`<p class="note" style="margin:0 0 8px">${S.canWrite?"还没有笔记。写下你的想法、可以怎么用到工作里。":"还没有笔记。"}</p>`}
    ${S.canWrite?`<form data-form="note" data-id="${esc(id)}"><textarea id="note-${esc(id)}" maxlength="2000" rows="2" placeholder="写一条笔记…"></textarea><button class="btn" type="submit">保存</button></form>`:""}
  </div>`;
}

function reg(id, o){ REG.set(id, o); }

function viewToday(){
  const d = S.days.find(x=>x.date===S.date);
  const rail = `<nav class="rail" aria-label="按日期浏览"><h2>归档</h2><ul class="dates">${S.days.map(x=>`<li><button type="button" data-act="date" data-d="${esc(x.date)}" aria-current="${x.date===S.date}"><span>${esc(x.date.slice(5))}</span><span class="wd">${wd(x.date)}</span></button></li>`).join("")}</ul></nav>`;
  if(!d) return `<div class="layout">${rail}<main><div class="empty">${S.ready?"<b>还没有内容。</b> 每天早上 7 点前，定时任务会把当天的 20 条精选放到这里。":"正在载入…"}</div></main></div>`;
  const items = (d.items||[]).slice().sort((a,b)=>(a.rank||0)-(b.rank||0));
  items.forEach(i=>reg(i.id,{kind:"item",date:d.date,title:i.title,url:i.url,category:i.category,author:i.author}));
  (d.videos||[]).forEach(v=>reg(v.id,{kind:"video",date:d.date,title:v.title,url:v.url,category:"YouTube",author:v.channel}));
  const cats = ["全部","重点", ...new Set(items.map(i=>i.category))];
  const pass = i => S.cat==="全部" || (S.cat==="重点" ? FOCUS.has(i.category) : i.category===S.cat);
  const card = i => `<li class="item ${i.rank<=3?"top3":""}">
      <div class="rank">${String(i.rank).padStart(2,"0")}</div>
      <div>
        <div class="meta"><span class="chip">${esc(i.category)}</span><span>${esc(i.author)}</span><span>${esc(i.time)}</span></div>
        <h4>${safeUrl(i.url)?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>`:esc(i.title)}</h4>
        <div class="bi"><p><span class="tag">中文</span>${esc(i.zh)}</p><p class="en"><span class="tag">English</span>${esc(i.en)}</p></div>

  const top = items.filter(i=>i.rank<=10 && pass(i)), more = items.filter(i=>i.rank>10 && pass(i));
  const vids = (d.videos||[]).slice().sort((a,b)=>(a.rank||99)-(b.rank||99));
  const nNotes = vids.filter(v=>v.notes&&v.notes.summary).length;
  return `<div class="layout">${rail}<main>
    <div class="dayhead"><h2>${esc(d.date)} ${wd(d.date)}</h2><span class="stamp">${vids.length} 个视频 · ${items.length} 条资讯${d.mode?` · ${esc(d.mode)}`:""}</span></div>
    ${vids.length?`<section class="yt" aria-label="YouTube Top 10"><div class="yt-head"><h3>YouTube Top ${vids.length}</h3><span>按热度和价值排序${nNotes?` · 前 ${nNotes} 个附中文笔记`:""}</span></div>
      <ol class="list">${vids.map((v,i)=>videoRow(v,i+1)).join("")}</ol></section>`:""}
    ${(d.highlights||[]).length?`<div class="brief"><h3 class="lab">今日要点 · Highlights</h3><ol>${d.highlights.map(h=>`<li>${esc(h.zh)}<span class="en">${esc(h.en)}</span></li>`).join("")}</ol></div>`:""}
    <div class="chips" role="group" aria-label="按类别筛选">${cats.map(c=>`<button type="button" data-act="cat" data-c="${esc(c)}" aria-pressed="${c===S.cat}">${esc(c)}</button>`).join("")}</div>
    ${top.length?`<h3 class="section-title">精选 Top 10</h3><ol class="list">${top.map(card).join("")}</ol>`:""}
    ${more.length?`<h3 class="section-title">更多值得看</h3><ol class="list">${more.map(card).join("")}</ol>`:""}

function tsec(t){ const p=String(t||"").split(":").map(Number); if(p.some(isNaN)) return 0; return p.reduce((a,b)=>a*60+b,0); }
function tlink(url, t){ const u=safeUrl(url); if(!u) return ""; return u + (u.includes("?")?"&":"?") + "t=" + tsec(t) + "s"; }
function videoRow(v, n){
  const nt = v.notes && v.notes.summary ? v.notes : null;
  const key = "vn:"+v.id, open = S.open.has(key);
  const meta = [v.channel, v.views, v.duration || (nt&&nt.duration), v.published].filter(Boolean).map(esc).join("</span><span>") || esc(v.meta||"");
  return `<li class="vrow ${nt?"has-notes":""}">
    <div class="n">${String(n).padStart(2,"0")}</div>
    <div>
      <h4>${safeUrl(v.url)?`<a href="${esc(v.url)}" target="_blank" rel="noopener">${ICON.play}<span>${esc(v.title)}</span></a>`:esc(v.title)}</h4>
      <div class="vmeta"><span>${meta}</span>${nt&&nt.guests?`<span>${esc(nt.guests)}</span>`:""}</div>
      ${nt?`<div class="summary"><b>一句话</b>${esc(nt.summary)}</div>`:(v.zh?`<p>${esc(v.zh)}</p>`:"")}
      ${v.take?`<p class="take"><b>点评</b>　${esc(v.take)}</p>`:""}
      ${nt&&open?`<div class="vnotes">

      </div>`:""}
      ${actions(v.id,{toLib:true,src:false, extra: nt?`<button class="act ${open?"on-open":""}" data-act="vnotes" data-id="${esc(key)}" aria-expanded="${open}">${open?"收起笔记":"看完整笔记"}</button>`:""})}
    </div></li>`;

function rowFor(m, n, opts={}){
  reg(m.id, REG.get(m.id) || {kind:m.kind,date:m.date,title:m.title,url:m.url,category:m.category,author:m.author});
  const r = REG.get(m.id);
  const metaBits = [r.category && `<span class="chip">${esc(r.category)}</span>`, r.author && `<span>${esc(r.author)}</span>`, r.date && `<span>${esc(r.date)}</span>`, r.kind==="lib" && `<span>武器库</span>`].filter(Boolean).join("");
  return `<li class="row ${opts.done?"done":""}">
    <div class="${opts.score?"score":"n"}">${opts.score?esc(n):String(n).padStart(2,"0")}</div>
    <div><div class="meta">${metaBits}</div>
      <h4>${safeUrl(r.url)?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</h4>
      ${opts.desc?`<p class="d">${esc(opts.desc)}</p>`:""}

function viewLater(){

      ? `<button class="act" data-act="undone" data-id="${esc(m.id)}">放回待读</button><button class="act danger" data-act="unlater" data-id="${esc(m.id)}">移出</button>`
      : `<button class="act" data-act="done" data-id="${esc(m.id)}">标记已读</button><button class="act danger" data-act="unlater" data-id="${esc(m.id)}">移出</button>`) : "";
  return `<div class="viewhead"><h2>稍后读</h2><p>没空看的先丢进来，按加入顺序排队。读完标记已读，想再看就放回待读。</p></div>

function mmNode(n, d){

const imgUrl = u => (/^https:\/\//.test(u||"") || /^assets\/[0-9a-f]{32}\.(jpg|png|webp)$/.test(u||"")) ? u : "";

    ${(nt.terms||[]).length?`<h5>关键概念</h5><ul class="terms">${nt.terms.map(t=>`<li><b>${esc(t.term)}</b>${esc(t.explain)}</li>`).join("")}</ul>`:""}

function counts(){
  $("#c-vn").textContent = S.lib.filter(l=>l.notes&&l.notes.summary).length;

  $("#c-later").textContent = ms.filter(m=>m.later&&!m.done).length;
  $("#c-favs").textContent = ms.filter(m=>m.fav).length;
  $("#c-lib").textContent = S.lib.length;
}
function render(){
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===S.view?"page":"false"));
  // keep any typed draft across re-render
  const drafts = {}; document.querySelectorAll("textarea[id^='note-'],.addform [id]").forEach(el=>drafts[el.id]=el.value);
  const active = document.activeElement?.id;
  const v = {today:viewToday, vnotes:viewVNotes, later:viewLater, favs:viewFavs, rank:viewRank, arsenal:viewArsenal}[S.view] || viewToday;
  $("#view").innerHTML = v();
  Object.entries(drafts).forEach(([k,val])=>{ const el=document.getElementById(k); if(el) el.value=val; });
  if(active){ const el=document.getElementById(active); if(el) el.focus(); }
  counts();
}

function route(){
  const h = location.hash.slice(1);
  if(h.startsWith("d-")){ S.view="today"; S.date=h.slice(2); }
  else S.view = ["today","vnotes","later","favs","rank","arsenal"].includes(h) ? h : "today";
  render();
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const id = b.dataset.id, act = b.dataset.act;
  switch(act){
    case "date": S.date=b.dataset.d; S.cat="全部"; try{history.replaceState(null,"","#d-"+S.date);}catch(_){} render(); window.scrollTo({top:0}); break;
    case "cat": S.cat=b.dataset.c; render(); break;
    case "ltab": S.laterTab=b.dataset.t; render(); break;
    case "ltype": S.libType=b.dataset.t; render(); break;
    case "notes": S.open.has(id)?S.open.delete(id):S.open.add(id); render(); setTimeout(()=>document.getElementById("note-"+id)?.focus(),0); break;
    case "vnotes": S.open.has(id)?S.open.delete(id):S.open.add(id); render(); break;
    case "toggle": { const wasOpen = S.open.has(id) || (b.getAttribute("aria-expanded")==="true"); S.touched.add(id); wasOpen?S.open.delete(id):S.open.add(id); render(); break; }
    case "vntype": S.vnType=b.dataset.t; render(); break;
    case "gonotes": location.hash="vnotes"; S.open.add("ln:"+id); setTimeout(()=>document.getElementById("card-"+id)?.scrollIntoView({block:"start"}),50); break;
    case "later": patch(id, m => { const on = !(m.later && !m.done); m.later=on; m.done=false; if(on) m.laterAt=Date.now(); return m; }); toast((markOf(id)?.later)?"已加入稍后读":"已移出稍后读"); break;
    case "fav": patch(id, m => { m.fav=!m.fav; if(m.fav) m.favAt=Date.now(); return m; }); toast(markOf(id)?.fav?"已收藏":"已取消收藏"); break;
    case "up": patch(id, m => { m.votes=(m.votes||0)+1; return m; }); break;
    case "down": patch(id, m => { m.votes=Math.max(0,(m.votes||0)-1); return m; }); break;
    case "done": patch(id, m => { m.done=true; return m; }); toast("已标记已读"); break;
    case "undone": patch(id, m => { m.done=false; m.laterAt=Date.now(); return m; }); toast("已放回待读"); break;
    case "unlater": patch(id, m => { m.later=false; m.done=false; return m; }); toast("已移出稍后读"); break;
    case "delnote": patch(id, m => { m.notes=(m.notes||[]).filter((_,i)=>i!==Number(b.dataset.i)); return m; }); break;
    case "tolib": toLib(id); break;
    case "dellib": S.confirm=id; render(); break;
    case "dellib-no": S.confirm=null; render(); break;
    case "dellib-yes": delLib(id); break;
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if(!f) return; e.preventDefault();
  if(f.dataset.form==="note"){
    const id=f.dataset.id, ta=document.getElementById("note-"+id), t=(ta?.value||"").trim(); if(!t) return;
    ta.value=""; patch(id, m => { m.notes=[...(m.notes||[]), {t, at:Date.now()}]; return m; }); toast("笔记已保存");
  } else if(f.dataset.form==="lib"){
    const title=$("#lib-title").value.trim(); if(!title) return;
    const url=$("#lib-url").value.trim();
    addLib({ type:$("#lib-type").value, title, url: safeUrl(url)?url:"", desc:$("#lib-desc").value.trim(), tags:$("#lib-tags").value.trim().split(/\s+/).filter(Boolean).slice(0,8) });
    ["lib-title","lib-url","lib-desc","lib-tags"].forEach(k=>{ const el=document.getElementById(k); if(el) el.value=""; });
  }
});

async function addLib(o){
  if(!S.canWrite||!db) return;
  const id = "lib-"+Date.now().toString(36);
  const doc = { id, createdAt:Date.now(), ...o };
  S.lib = [...S.lib, doc]; render();
  try{ await db.collection("library").doc(id).set(doc); toast("已加入武器库"); }catch(e){ toast("没保存上，请重试"); console.error(e); }
}
function toLib(id){
  const r = REG.get(id); if(!r) return;
  if(S.lib.some(l=>l.url && l.url===r.url)){ toast("武器库里已经有这一条了"); return; }
  addLib({ type: r.kind==="video" ? "视频" : "文章", src:id, title:r.title, url:r.url, desc:`来自 ${r.date} 每日精选 · ${r.author||""}`.trim(), tags:[r.category].filter(Boolean) });
}
async function delLib(id){
  S.confirm=null; S.lib=S.lib.filter(l=>l.id!==id); render();
  try{ await db.collection("library").doc(id).delete(); toast("已删除"); }catch(e){ toast("删除失败，请重试"); }
}

// —— GitHub Pages 版：内容来自 data/days/*.json；稍后读、收藏、+1、笔记、武器库存在本浏览器（localStorage） ——
const LS_KEY = "ai-daily-brief:v1";
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(_){ return {}; } }
function lsSave(st){ try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); return true; }catch(_){ return false; } }
const LOCAL = lsLoad(); LOCAL.marks = LOCAL.marks || {}; LOCAL.library = LOCAL.library || {};
db = { collection: name => ({ doc: id => ({
  set: async v => { LOCAL[name] = LOCAL[name] || {}; LOCAL[name][id] = v; if(!lsSave(LOCAL)) throw new Error("storage"); },
  delete: async () => { if(LOCAL[name]) delete LOCAL[name][id]; lsSave(LOCAL); }
}) }) };
(async () => {
  route();
  const stamp = $("#stamp");
  S.canWrite = true;
  let shared = {};
  try{ const arr = await (await fetch("data/marks.json",{cache:"no-cache"})).json(); (Array.isArray(arr)?arr:[]).forEach(m=>{ if(m&&m.id) shared[m.id]=m; }); }catch(_){}
  S.marks = new Map(Object.entries({...shared, ...LOCAL.marks}));
  try{
    const sh = await (await fetch("data/library.json",{cache:"no-cache"})).json();
    S.lib = [...(Array.isArray(sh)?sh:[]), ...Object.values(LOCAL.library)];
  }catch(_){ S.lib = Object.values(LOCAL.library); }
  try{
    const idx = await (await fetch("data/days/index.json",{cache:"no-cache"})).json();
    const dates = (idx.dates||[]).slice().sort().reverse().slice(0,120);
    const docs = await Promise.all(dates.map(d => fetch(`data/days/${d}.json`,{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null)));
    S.days = docs.filter(x=>x&&x.date).sort((a,b)=>a.date<b.date?1:-1);
    if(!S.date || !S.days.some(d=>d.date===S.date)) S.date = S.days[0]?.date || null;
    stamp.textContent = S.days.length ? `共 ${S.days.length} 期 · 最新 ${S.days[0].date}` : "还没有内容";
  }catch(e){ stamp.textContent = "数据载入失败，请刷新页面"; console.error(e); }
  S.ready = true; render();
})();
</script>
