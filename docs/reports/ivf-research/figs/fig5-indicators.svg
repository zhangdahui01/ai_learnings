</defs><rect width="1200" height="1560" fill="#FBF7F2"/><text x="60" y="84" font-size="44" fill="#2A2833" font-weight="700" text-anchor="start" >图 5 · 三个指标各管什么</text><text x="60" y="128" font-size="24" fill="#6B6878" font-weight="400" text-anchor="start" >AMH 和窦卵泡数决定“一次能取多少”，年龄决定“取到的有多少是好的”</text><line x1="60" y1="152" x2="1140" y2="152" stroke="#D8D2C8" stroke-width="2" /><rect x="60" y="180" width="1080" height="200" rx="22" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><text x="90" y="226" font-size="28" fill="#2A2833" font-weight="700" text-anchor="start" >AMH</text><text x="192" y="226" font-size="20" fill="#6B6878" font-weight="400" text-anchor="start" >抗穆勒管激素 · 抽血，任何一天可查</text><rect x="90" y="252" width="139.71428571428572" height="44" rx="12" fill="#C8455F" stroke="none" stroke-width="2" /><text x="159.85714285714286" y="282" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >很低</text><text x="159.85714285714286" y="326" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >预计取卵 1–3 个</text><rect x="235.71428571428572" y="252" width="198.0" height="44" rx="12" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="334.7142857142857" y="282" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >偏低</text><text x="334.7142857142857" y="326" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >预计 3–6 个</text><rect x="439.7142857142857" y="252" width="431.14285714285717" height="44" rx="12" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="655.2857142857143" y="282" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >正常</text><text x="655.2857142857143" y="326" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >预计 8–15 个</text><rect x="876.8571428571429" y="252" width="227.14285714285714" height="44" rx="12" fill="#E0A030" stroke="none" stroke-width="2" /><text x="990.4285714285714" y="282" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >偏高</text><text x="990.4285714285714" y="326" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >卵多，防过度刺激</text><text x="232.71428571428572" y="360" font-size="18" fill="#6B6878" font-weight="600" text-anchor="middle" >0.5</text><text x="436.7142857142857" y="360" font-size="18" fill="#6B6878" font-weight="600" text-anchor="middle" >1.2</text><text x="873.8571428571429" y="360" font-size="18" fill="#6B6878" font-weight="600" text-anchor="middle" >3.5</text><text x="1110" y="226" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >单位 ng/mL</text><rect x="60" y="400" width="1080" height="200" rx="22" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><text x="90" y="446" font-size="28" fill="#2A2833" font-weight="700" text-anchor="start" >AFC</text><text x="192" y="446" font-size="20" fill="#6B6878" font-weight="400" text-anchor="start" >窦卵泡计数 · 月经第 2–4 天阴道 B 超，两侧相加</text><rect x="90" y="472" width="139.71428571428572" height="44" rx="12" fill="#C8455F" stroke="none" stroke-width="2" /><text x="159.85714285714286" y="502" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >很少</text><text x="159.85714285714286" y="546" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >少于 5 个</text><rect x="235.71428571428572" y="472" width="198.0" height="44" rx="12" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="334.7142857142857" y="502" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >偏少</text><text x="334.7142857142857" y="546" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >5–9 个</text><rect x="439.7142857142857" y="472" width="431.14285714285717" height="44" rx="12" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="655.2857142857143" y="502" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >正常</text><text x="655.2857142857143" y="546" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >10–20 个</text><rect x="876.8571428571429" y="472" width="227.14285714285714" height="44" rx="12" fill="#E0A030" stroke="none" stroke-width="2" /><text x="990.4285714285714" y="502" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >偏多</text><text x="990.4285714285714" y="546" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >20 个以上</text><text x="232.71428571428572" y="580" font-size="18" fill="#6B6878" font-weight="600" text-anchor="middle" >5</text><text x="436.7142857142857" y="580" font-size="18" fill="#6B6878" font-weight="600" text-anchor="middle" >10</text><text x="873.8571428571429" y="580" font-size="18" fill="#6B6878" font-weight="600" text-anchor="middle" >20</text><text x="1110" y="446" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >单位：个</text><rect x="60" y="620" width="1080" height="200" rx="22" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><text x="90" y="666" font-size="28" fill="#2A2833" font-weight="700" text-anchor="start" >FSH</text><text x="192" y="666" font-size="20" fill="#6B6878" font-weight="400" text-anchor="start" >基础卵泡刺激素 · 月经第 2–4 天抽血，配合雌二醇看</text><rect x="90" y="692" width="487.54838709677426" height="44" rx="12" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="333.77419354838713" y="722" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >正常</text><text x="333.77419354838713" y="766" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >低于 10</text><rect x="583.5483870967743" y="692" width="257.2258064516129" height="44" rx="12" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="712.1612903225807" y="722" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >偏高</text><text x="712.1612903225807" y="766" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >10–15，储备在下降</text><rect x="846.7741935483872" y="692" width="257.2258064516129" height="44" rx="12" fill="#C8455F" stroke="none" stroke-width="2" /><text x="975.3870967741937" y="722" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" >明显升高</text><text x="975.3870967741937" y="766" font-size="18" fill="#2A2833" font-weight="400" text-anchor="middle" >高于 15，促排反应可能差</text><text x="580.5483870967743" y="800" font-size="18" fill="#6B6878" font-weight="600" text-anchor="middle" >10</text><text x="843.7741935483872" y="800" font-size="18" fill="#6B6878" font-weight="600" text-anchor="middle" >15</text><text x="1110" y="666" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >单位 IU/L</text><rect x="60" y="850" width="1080" height="560" rx="22" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><text x="90" y="898" font-size="28" fill="#2A2833" font-weight="700" text-anchor="start" >年龄</text><text x="160" y="898" font-size="20" fill="#6B6878" font-weight="400" text-anchor="start" >决定卵子质量，是任何指标都替代不了的</text><line x1="150" y1="1290.0" x2="1100" y2="1290.0" stroke="#EFEBE5" stroke-width="2" /><text x="138" y="1296.0" font-size="17" fill="#6B6878" font-weight="400" text-anchor="end" >0%</text><line x1="150" y1="1204.2857142857142" x2="1100" y2="1204.2857142857142" stroke="#EFEBE5" stroke-width="2" /><text x="138" y="1210.2857142857142" font-size="17" fill="#6B6878" font-weight="400" text-anchor="end" >20%</text><line x1="150" y1="1118.5714285714287" x2="1100" y2="1118.5714285714287" stroke="#EFEBE5" stroke-width="2" /><text x="138" y="1124.5714285714287" font-size="17" fill="#6B6878" font-weight="400" text-anchor="end" >40%</text><line x1="150" y1="1032.857142857143" x2="1100" y2="1032.857142857143" stroke="#EFEBE5" stroke-width="2" /><text x="138" y="1038.857142857143" font-size="17" fill="#6B6878" font-weight="400" text-anchor="end" >60%</text><rect x="190" y="1113.0" width="62" height="177.0" rx="8" fill="#EBA9B7" stroke="none" stroke-width="2" /><rect x="260" y="996.8571428571429" width="62" height="293.14285714285717" rx="8" fill="#9CCFCB" stroke="none" stroke-width="2" /><text x="221" y="1103.0" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >41.3%</text><text x="291" y="986.8571428571429" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >68.4%</text><text x="256" y="1324" font-size="21" fill="#2A2833" font-weight="400" text-anchor="middle" >35 岁以下</text><rect x="375" y="1149.4285714285716" width="62" height="140.57142857142856" rx="8" fill="#EBA9B7" stroke="none" stroke-width="2" /><rect x="445" y="1042.2857142857142" width="62" height="247.7142857142857" rx="8" fill="#9CCFCB" stroke="none" stroke-width="2" /><text x="406" y="1139.4285714285716" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >32.8%</text><text x="476" y="1032.2857142857142" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >57.8%</text><text x="441" y="1324" font-size="21" fill="#2A2833" font-weight="400" text-anchor="middle" >35–37</text><rect x="560" y="1191.0" width="62" height="99.0" rx="8" fill="#D95F7B" stroke="none" stroke-width="2" /><rect x="630" y="1106.142857142857" width="62" height="183.85714285714286" rx="8" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="591" y="1181.0" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >23.1%</text><text x="661" y="1096.142857142857" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >42.9%</text><text x="626" y="1324" font-size="21" fill="#2A2833" font-weight="700" text-anchor="middle" >38–40</text><rect x="745" y="1235.5714285714287" width="62" height="54.42857142857142" rx="8" fill="#D95F7B" stroke="none" stroke-width="2" /><rect x="815" y="1188.0" width="62" height="102.00000000000001" rx="8" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="776" y="1225.5714285714287" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >12.7%</text><text x="846" y="1178.0" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >23.8%</text><text x="811" y="1324" font-size="21" fill="#2A2833" font-weight="700" text-anchor="middle" >41–42</text><rect x="930" y="1269.857142857143" width="62" height="20.142857142857142" rx="8" fill="#D95F7B" stroke="none" stroke-width="2" /><rect x="1000" y="1255.7142857142858" width="62" height="34.285714285714285" rx="8" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="961" y="1259.857142857143" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >4.7%</text><text x="1031" y="1245.7142857142858" font-size="20" fill="#2A2833" font-weight="700" text-anchor="middle" >8.0%</text><text x="996" y="1324" font-size="21" fill="#2A2833" font-weight="700" text-anchor="middle" >42 以上</text><rect x="700" y="928" width="22" height="22" rx="5" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="730" y="946" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >每次取卵的活产率</text><rect x="700" y="960" width="22" height="22" rx="5" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="730" y="978" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >多次取卵后的累计活产率</text><text x="90" y="1380" font-size="19" fill="#6B6878" font-weight="400" text-anchor="start" >38–40 岁到 41–42 岁，每次取卵的活产率几乎减半。数据：美国 SART 2022 年全国报告，自卵。</text><rect x="60" y="1430" width="1080" height="70" rx="18" fill="#FBEFD3" stroke="none" stroke-width="2" /><text x="90" y="1474" font-size="23" fill="#2A2833" font-weight="700" text-anchor="start" >怎么读：AMH 低但年龄轻，卵少而好；AMH 正常但 42 岁，卵多而差。两样都要看。</text><text x="60" y="1526" font-size="18" fill="#6B6878" font-weight="400" text-anchor="start" >分档界值为临床常用参考（如 POSEIDON 标准以 AMH 1.2 ng/mL、AFC 5 个为界），各实验室和医生的标准略有不同。</text></svg>