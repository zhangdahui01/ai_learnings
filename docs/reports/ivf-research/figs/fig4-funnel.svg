</defs><rect width="1200" height="1170" fill="#FBF7F2"/><text x="60" y="84" font-size="44" fill="#2A2833" font-weight="700" text-anchor="start" >图 4 · 卵子漏斗：为什么 40 岁要多取几次</text><text x="60" y="128" font-size="24" fill="#6B6878" font-weight="400" text-anchor="start" >同样一次取卵，每一步都在减少；年龄越大，起点越低、损耗越多</text><line x1="60" y1="152" x2="1140" y2="152" stroke="#D8D2C8" stroke-width="2" /><rect x="90" y="180" width="510" height="810" rx="24" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="275" y="204" width="196.88" height="48" rx="24.0" fill="#DDF1EF" stroke="none" stroke-width="2" /><text x="373.44" y="237.36" font-size="26" fill="#2A8F8A" font-weight="600" text-anchor="middle" >35 岁以下</text><path d="M135.0 360 L555.0 360 L499.0 440 L191.0 440Z" fill="#DDF1EF" stroke="none" stroke-width="0" opacity="0.7"/><rect x="135.0" y="290" width="420.0" height="70" rx="14" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="345" y="336" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" >15 个</text><text x="110" y="280" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >取到的卵子</text><path d="M191.0 510 L499.0 510 L471.0 590 L219.0 590Z" fill="#DDF1EF" stroke="none" stroke-width="0" opacity="0.7"/><rect x="191.0" y="440" width="308.0" height="70" rx="14" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="345" y="486" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" >11 个</text><text x="110" y="430" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >成熟卵子</text><path d="M219.0 660 L471.0 660 L429.0 740 L261.0 740Z" fill="#DDF1EF" stroke="none" stroke-width="0" opacity="0.7"/><rect x="219.0" y="590" width="252.0" height="70" rx="14" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="345" y="636" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" >9 个</text><text x="110" y="580" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >正常受精</text><path d="M261.0 810 L429.0 810 L394.0 890 L296.0 890Z" fill="#DDF1EF" stroke="none" stroke-width="0" opacity="0.7"/><rect x="261.0" y="740" width="168.0" height="70" rx="14" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="345" y="786" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" >6 个</text><text x="110" y="730" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >长成囊胚</text><rect x="296.0" y="890" width="98.0" height="70" rx="14" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="408.0" y="936" font-size="30" fill="#2A8F8A" font-weight="700" text-anchor="start" >3–4 个</text><text x="110" y="880" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >染色体正常</text><rect x="630" y="180" width="510" height="810" rx="24" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="815" y="204" width="222.35999999999999" height="48" rx="24.0" fill="#FBE4EA" stroke="none" stroke-width="2" /><text x="926.18" y="237.36" font-size="26" fill="#D95F7B" font-weight="600" text-anchor="middle" >40–42 岁</text><path d="M773.0 360 L997.0 360 L969.0 440 L801.0 440Z" fill="#FBE4EA" stroke="none" stroke-width="0" opacity="0.7"/><rect x="773.0" y="290" width="224.0" height="70" rx="14" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="885" y="336" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" >8 个</text><text x="650" y="280" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >取到的卵子</text><path d="M801.0 510 L969.0 510 L948.0 590 L822.0 590Z" fill="#FBE4EA" stroke="none" stroke-width="0" opacity="0.7"/><rect x="801.0" y="440" width="168.0" height="70" rx="14" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="885" y="486" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" >6 个</text><text x="650" y="430" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >成熟卵子</text><path d="M822.0 660 L948.0 660 L920.0 740 L850.0 740Z" fill="#FBE4EA" stroke="none" stroke-width="0" opacity="0.7"/><rect x="822.0" y="590" width="126.0" height="70" rx="14" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="885" y="636" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" >4–5 个</text><text x="650" y="580" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >正常受精</text><path d="M850.0 810 L920.0 810 L898.0 890 L872.0 890Z" fill="#FBE4EA" stroke="none" stroke-width="0" opacity="0.7"/><rect x="850.0" y="740" width="70.0" height="70" rx="14" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="934.0" y="786" font-size="30" fill="#D95F7B" font-weight="700" text-anchor="start" >2–3 个</text><text x="650" y="730" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >长成囊胚</text><rect x="872.0" y="890" width="26" height="70" rx="14" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="912.0" y="936" font-size="30" fill="#D95F7B" font-weight="700" text-anchor="start" >约 1 个</text><text x="650" y="880" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >染色体正常</text><text x="580" y="408" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >成熟 约 75%</text><text x="1120" y="408" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >成熟 约 75%</text><text x="580" y="558" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >受精 约 75%</text><text x="1120" y="558" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >受精 约 75%</text><text x="580" y="708" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >成囊 约 2/3</text><text x="1120" y="708" font-size="18" fill="#D95F7B" font-weight="600" text-anchor="end" >成囊 约 55%</text><text x="580" y="858" font-size="18" fill="#6B6878" font-weight="400" text-anchor="end" >正常 约 60%</text><text x="1120" y="858" font-size="18" fill="#D95F7B" font-weight="600" text-anchor="end" >正常 约 30%</text><rect x="60" y="1015" width="1080" height="96" rx="20" fill="#FBEFD3" stroke="none" stroke-width="2" /><text x="90" y="1055" font-size="24" fill="#2A2833" font-weight="700" text-anchor="start" >结论：40–42 岁一次取卵平均只得到约 1 个染色体正常的胚胎，</text><text x="90" y="1090" font-size="24" fill="#2A2833" font-weight="700" text-anchor="start" >42 岁时约三分之一的周期一个都没有。多取几次，就是在把这个数字攒上去。</text><text x="60" y="1136" font-size="18" fill="#6B6878" font-weight="400" text-anchor="start" >示意估算：按文献中的典型比例推算（成熟、受精、成囊、整倍体率），个体差异很大，不代表任何人的预测结果。</text></svg>