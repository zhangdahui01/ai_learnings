</defs><rect width="1200" height="1200" fill="#FBF7F2"/><text x="60" y="84" font-size="44" fill="#2A2833" font-weight="700" text-anchor="start" >图 3 · 一个完整周期的时间表</text><text x="60" y="128" font-size="24" fill="#6B6878" font-weight="400" text-anchor="start" >从月经第 2 天打第一针，到验孕，约 6–10 周；人在当地的时间约 3 周</text><line x1="60" y1="152" x2="1140" y2="152" stroke="#D8D2C8" stroke-width="2" /><line x1="110.0" y1="250" x2="110.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="110.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="start" >第1周</text><line x1="212.0" y1="250" x2="212.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="212.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第2周</text><line x1="314.0" y1="250" x2="314.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="314.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第3周</text><line x1="416.0" y1="250" x2="416.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="416.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第4周</text><line x1="518.0" y1="250" x2="518.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="518.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第5周</text><line x1="620.0" y1="250" x2="620.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="620.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第6周</text><line x1="722.0" y1="250" x2="722.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="722.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第7周</text><line x1="824.0" y1="250" x2="824.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="824.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第8周</text><line x1="926.0" y1="250" x2="926.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="926.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第9周</text><line x1="1028.0" y1="250" x2="1028.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="1028.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" >第10周</text><line x1="1130.0" y1="250" x2="1130.0" y2="980" stroke="#EFEBE5" stroke-width="2" /><text x="1130.0" y="238" font-size="18" fill="#6B6878" font-weight="400" text-anchor="middle" ></text><rect x="60" y="270" width="1080" height="230" rx="20" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" /><text x="84" y="308" font-size="22" fill="#2A2833" font-weight="700" text-anchor="start" >卵泡在长大</text><text x="84" y="336" font-size="18" fill="#6B6878" font-weight="400" text-anchor="start" >B 超监测 4–6 次</text><circle cx="150" cy="410" r="8" fill="url(#egg)" stroke="#E0A030" stroke-width="2" /><text x="150" y="470" font-size="17" fill="#6B6878" font-weight="400" text-anchor="middle" >5mm</text><circle cx="225" cy="410" r="13" fill="url(#egg)" stroke="#E0A030" stroke-width="2" /><text x="225" y="470" font-size="17" fill="#6B6878" font-weight="400" text-anchor="middle" >8mm</text><circle cx="305" cy="410" r="18" fill="url(#egg)" stroke="#E0A030" stroke-width="2" /><text x="305" y="470" font-size="17" fill="#6B6878" font-weight="400" text-anchor="middle" >11mm</text><circle cx="390" cy="410" r="23" fill="url(#egg)" stroke="#E0A030" stroke-width="2" /><text x="390" y="470" font-size="17" fill="#6B6878" font-weight="400" text-anchor="middle" >14mm</text><circle cx="480" cy="410" r="28" fill="url(#egg)" stroke="#E0A030" stroke-width="2" /><text x="480" y="470" font-size="17" fill="#6B6878" font-weight="400" text-anchor="middle" >17mm</text><circle cx="575" cy="410" r="33" fill="url(#egg)" stroke="#E0A030" stroke-width="2" /><text x="575" y="470" font-size="17" fill="#6B6878" font-weight="400" text-anchor="middle" >20mm</text><path d="M625 410 L672 410" fill="none" stroke="#D95F7B" stroke-width="3" marker-end="url(#arR)"/><text x="648" y="392" font-size="17" fill="#D95F7B" font-weight="600" text-anchor="middle" >扳机针</text><circle cx="700" cy="410" r="20" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="700" y="418" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle" >取</text><text x="750" y="330" font-size="20" fill="#2A2833" font-weight="600" text-anchor="start" >实验室：受精 → 囊胚 → 活检 → 冷冻</text><circle cx="770" cy="410" r="16" fill="#FFFDF7" stroke="#E0A030" stroke-width="2" /><circle cx="770" cy="410" r="5.0" fill="url(#cell)" stroke="#D9738A" stroke-width="1" /><circle cx="816" cy="410" r="16" fill="#FFFDF7" stroke="#E0A030" stroke-width="2" /><circle cx="816" cy="410" r="6.5" fill="url(#cell)" stroke="#D9738A" stroke-width="1" /><circle cx="862" cy="410" r="16" fill="#FFFDF7" stroke="#E0A030" stroke-width="2" /><circle cx="862" cy="410" r="8.0" fill="url(#cell)" stroke="#D9738A" stroke-width="1" /><circle cx="908" cy="410" r="16" fill="#FFFDF7" stroke="#E0A030" stroke-width="2" /><circle cx="908" cy="410" r="9.5" fill="url(#cell)" stroke="#D9738A" stroke-width="1" /><circle cx="954" cy="410" r="16" fill="#FFFDF7" stroke="#E0A030" stroke-width="2" /><circle cx="954" cy="410" r="11.0" fill="url(#cell)" stroke="#D9738A" stroke-width="1" /><circle cx="1000" cy="410" r="16" fill="#FFFDF7" stroke="#E0A030" stroke-width="2" /><circle cx="1000" cy="410" r="12.5" fill="url(#cell)" stroke="#D9738A" stroke-width="1" /><text x="750" y="470" font-size="18" fill="#6B6878" font-weight="400" text-anchor="start" >PGT-A 结果约 1–2 周后出</text><rect x="124.57142857142857" y="540" width="160.28571428571433" height="34" rx="17" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="298.8571428571429" y="558" font-size="22" fill="#2A2833" font-weight="700" text-anchor="start" >促排卵打针</text><text x="298.8571428571429" y="584" font-size="17" fill="#6B6878" font-weight="400" text-anchor="start" >每天 1–3 针，共 8–12 天</text><rect x="314.0" y="602" width="18" height="34" rx="17" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="342.57142857142856" y="620" font-size="22" fill="#2A2833" font-weight="700" text-anchor="start" >取卵</text><text x="342.57142857142856" y="646" font-size="17" fill="#6B6878" font-weight="400" text-anchor="start" >手术 15–20 分钟，当天回住处</text><rect x="314.0" y="664" width="87.42857142857144" height="34" rx="17" fill="#E0A030" stroke="none" stroke-width="2" /><text x="415.42857142857144" y="682" font-size="22" fill="#2A2833" font-weight="700" text-anchor="start" >胚胎培养与冷冻</text><text x="415.42857142857144" y="708" font-size="17" fill="#6B6878" font-weight="400" text-anchor="start" >5–6 天</text><rect x="401.42857142857144" y="726" width="204.0" height="34" rx="17" fill="#7667C9" stroke="none" stroke-width="2" /><text x="619.4285714285714" y="744" font-size="22" fill="#2A2833" font-weight="700" text-anchor="start" >等 PGT-A 结果</text><text x="619.4285714285714" y="770" font-size="17" fill="#6B6878" font-weight="400" text-anchor="start" >人可以离开</text><rect x="620.0" y="788" width="291.42857142857144" height="34" rx="17" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="606.0" y="806" font-size="22" fill="#2A2833" font-weight="700" text-anchor="end" >内膜准备</text><text x="606.0" y="832" font-size="17" fill="#6B6878" font-weight="400" text-anchor="end" >口服或贴雌激素 + 黄体酮，约 2–3 周，可在居住地做</text><rect x="911.4285714285714" y="850" width="18" height="34" rx="17" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="897.4285714285714" y="868" font-size="22" fill="#2A2833" font-weight="700" text-anchor="end" >胚胎移植</text><text x="897.4285714285714" y="894" font-size="17" fill="#6B6878" font-weight="400" text-anchor="end" >几分钟，无需麻醉</text><rect x="1071.7142857142858" y="912" width="18" height="34" rx="17" fill="#E0A030" stroke="none" stroke-width="2" /><text x="1057.7142857142858" y="930" font-size="22" fill="#2A2833" font-weight="700" text-anchor="end" >验孕</text><text x="1057.7142857142858" y="956" font-size="17" fill="#6B6878" font-weight="400" text-anchor="end" >移植后 10–14 天抽血</text><rect x="110.0" y="996" width="247.71428571428572" height="30" rx="15" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="110.0" y="1056" font-size="21" fill="#D95F7B" font-weight="700" text-anchor="start" >第 1 次行程：约 16–18 天</text><rect x="838.5714285714286" y="996" width="116.57142857142856" height="30" rx="15" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="955.1428571428571" y="1056" font-size="21" fill="#D95F7B" font-weight="700" text-anchor="end" >第 2 次行程：约 7 天</text><text x="598.1428571428571" y="1018" font-size="19" fill="#6B6878" font-weight="400" text-anchor="middle" >回居住地，正常工作生活</text><text x="60" y="1108" font-size="21" fill="#2A2833" font-weight="600" text-anchor="start" >要攒胚胎时：第 1 次行程重复 2–3 遍（每次间隔 1–2 个月），最后再统一移植。</text><text x="60" y="1166" font-size="18" fill="#6B6878" font-weight="400" text-anchor="start" >时间为常见方案的大致范围；拮抗剂方案、微刺激方案的天数会不同，以医生安排为准。</text></svg>