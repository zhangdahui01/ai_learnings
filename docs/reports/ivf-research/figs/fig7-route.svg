</defs><rect width="1200" height="1540" fill="#FBF7F2"/><text x="60" y="84" font-size="44" fill="#2A2833" font-weight="700" text-anchor="start" >图 7 · 美国路线：从今天到移植</text><text x="60" y="128" font-size="24" fill="#6B6878" font-weight="400" text-anchor="start" >以洛杉矶为例，三次往返，在美停留合计约 6 周</text><line x1="60" y1="152" x2="1140" y2="152" stroke="#D8D2C8" stroke-width="2" /><line x1="118" y1="220" x2="118" y2="1334" stroke="#D8D2C8" stroke-width="4" /><circle cx="118" cy="224" r="22" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="118" y="232" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle" >1</text><rect x="170" y="190" width="970" height="154" rx="20" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="194" y="206" width="158.34" height="34" rx="17.0" fill="#DDF1EF" stroke="none" stroke-width="2" /><text x="273.17" y="229.84" font-size="19" fill="#2A8F8A" font-weight="600" text-anchor="middle" >第 1–2 周</text><text x="366.34000000000003" y="232" font-size="26" fill="#2A2833" font-weight="700" text-anchor="start" >在居住地体检</text><circle cx="204" cy="260" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="266" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >AMH、窦卵泡数、FSH、雌二醇</text><circle cx="204" cy="286" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="292" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >甲状腺、宫颈、乳腺、传染病四项</text><circle cx="204" cy="312" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="318" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >开始每天吃叶酸</text><text x="1116" y="232" font-size="19" fill="#2A8F8A" font-weight="700" text-anchor="end" >普通妇科门诊即可</text><circle cx="118" cy="396" r="22" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="118" y="404" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle" >2</text><rect x="170" y="362" width="970" height="154" rx="20" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="194" y="378" width="158.34" height="34" rx="17.0" fill="#DDF1EF" stroke="none" stroke-width="2" /><text x="273.17" y="401.84" font-size="19" fill="#2A8F8A" font-weight="600" text-anchor="middle" >第 2–4 周</text><text x="366.34000000000003" y="404" font-size="26" fill="#2A2833" font-weight="700" text-anchor="start" >视频初诊 2–3 家诊所</text><circle cx="204" cy="432" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="438" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >发检查报告，约医生视频</text><circle cx="204" cy="458" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="464" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >问：预计取卵数、建议次数、逐项报价</text><circle cx="204" cy="484" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="490" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >同时预约美国 B1/B2 签证面谈</text><text x="1116" y="404" font-size="19" fill="#2A8F8A" font-weight="700" text-anchor="end" >每家约 300–500 美元</text><circle cx="118" cy="568" r="22" fill="#2A8F8A" stroke="none" stroke-width="2" /><text x="118" y="576" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle" >3</text><rect x="170" y="534" width="970" height="154" rx="20" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="194" y="550" width="158.34" height="34" rx="17.0" fill="#DDF1EF" stroke="none" stroke-width="2" /><text x="273.17" y="573.84" font-size="19" fill="#2A8F8A" font-weight="600" text-anchor="middle" >第 4–8 周</text><text x="366.34000000000003" y="576" font-size="26" fill="#2A2833" font-weight="700" text-anchor="start" >定诊所、选精子、备行程</text><circle cx="204" cy="604" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="610" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >本人做遗传携带者筛查</text><circle cx="204" cy="630" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="636" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >在精子库选捐赠者，买 2 管寄到诊所</text><circle cx="204" cy="656" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="662" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >订机票和诊所附近的住处</text><text x="1116" y="576" font-size="19" fill="#2A8F8A" font-weight="700" text-anchor="end" >精子 2 管约 1,800–4,800 美元</text><circle cx="118" cy="740" r="22" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="118" y="748" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle" >4</text><rect x="170" y="706" width="970" height="154" rx="20" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="194" y="722" width="176.96" height="34" rx="17.0" fill="#FBE4EA" stroke="none" stroke-width="2" /><text x="282.48" y="745.84" font-size="19" fill="#D95F7B" font-weight="600" text-anchor="middle" >第 2–3 个月</text><text x="384.96000000000004" y="748" font-size="26" fill="#2A2833" font-weight="700" text-anchor="start" >第 1 次赴美：取卵</text><circle cx="204" cy="776" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="782" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >月经第 1–2 天到达，基线检查</text><circle cx="204" cy="802" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="808" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >打针 8–12 天，隔天 B 超抽血</text><circle cx="204" cy="828" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="834" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >取卵 → 受精 → 活检冷冻，休息 2 天后返程</text><text x="1116" y="748" font-size="19" fill="#D95F7B" font-weight="700" text-anchor="end" >停留 16–18 天</text><circle cx="118" cy="912" r="22" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="118" y="920" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle" >5</text><rect x="170" y="878" width="970" height="154" rx="20" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="194" y="894" width="176.96" height="34" rx="17.0" fill="#FBE4EA" stroke="none" stroke-width="2" /><text x="282.48" y="917.84" font-size="19" fill="#D95F7B" font-weight="600" text-anchor="middle" >第 4–5 个月</text><text x="384.96000000000004" y="920" font-size="26" fill="#2A2833" font-weight="700" text-anchor="start" >第 2 次赴美：再取一次</text><circle cx="204" cy="948" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="954" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >正常胚胎不足 2 个时进行</text><circle cx="204" cy="974" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="980" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >流程同上，可换方案</text><circle cx="204" cy="1000" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="1006" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >两次的胚胎一起等 PGT-A 结果</text><text x="1116" y="920" font-size="19" fill="#D95F7B" font-weight="700" text-anchor="end" >停留 16–18 天</text><circle cx="118" cy="1084" r="22" fill="#D95F7B" stroke="none" stroke-width="2" /><text x="118" y="1092" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle" >6</text><rect x="170" y="1050" width="970" height="154" rx="20" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="194" y="1066" width="176.96" height="34" rx="17.0" fill="#FBE4EA" stroke="none" stroke-width="2" /><text x="282.48" y="1089.84" font-size="19" fill="#D95F7B" font-weight="600" text-anchor="middle" >第 6–7 个月</text><text x="384.96000000000004" y="1092" font-size="26" fill="#2A2833" font-weight="700" text-anchor="start" >第 3 次赴美：移植</text><circle cx="204" cy="1120" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="1126" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >内膜准备在居住地做，B 超结果发诊所</text><circle cx="204" cy="1146" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="1152" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >移植前 3–5 天到达，移 1 枚胚胎</text><circle cx="204" cy="1172" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="1178" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >休息 2–3 天返程，10–14 天后验孕</text><text x="1116" y="1092" font-size="19" fill="#D95F7B" font-weight="700" text-anchor="end" >停留约 7 天</text><circle cx="118" cy="1256" r="22" fill="#E0A030" stroke="none" stroke-width="2" /><text x="118" y="1264" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle" >7</text><rect x="170" y="1222" width="970" height="154" rx="20" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2" filter="url(#sh)"/><rect x="194" y="1238" width="65.24000000000001" height="34" rx="17.0" fill="#FBEFD3" stroke="none" stroke-width="2" /><text x="226.62" y="1261.84" font-size="19" fill="#A8741A" font-weight="600" text-anchor="middle" >之后</text><text x="273.24" y="1264" font-size="26" fill="#2A2833" font-weight="700" text-anchor="start" >回居住地产检分娩</text><circle cx="204" cy="1292" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="1298" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >孕 8–10 周从生殖诊所“毕业”</text><circle cx="204" cy="1318" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="1324" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >转普通产科，按高龄孕妇管理</text><circle cx="204" cy="1344" r="3.5" fill="#6B6878" stroke="none" stroke-width="2" /><text x="218" y="1350" font-size="19" fill="#2A2833" font-weight="400" text-anchor="start" >剩余胚胎继续冷冻保存</text><text x="1116" y="1264" font-size="19" fill="#A8741A" font-weight="700" text-anchor="end" >胚胎储存约 800 美元/年</text><rect x="60" y="1398" width="1080" height="70" rx="18" fill="#FBEFD3" stroke="none" stroke-width="2" /><text x="90" y="1442" font-size="21" fill="#2A2833" font-weight="700" text-anchor="start" >省一趟的办法：问诊所是否接受前 5–6 天在居住地监测，第 1、2 次行程可各缩短到约 10 天。</text><text x="60" y="1506" font-size="18" fill="#6B6878" font-weight="400" text-anchor="start" >时间和费用为规划用的估算；实际以诊所方案和个人身体反应为准。</text></svg>